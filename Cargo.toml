[package]
name = "bnk8"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
brotli = "9.1.3"
clap = { version = "4.6.7", features = ["derive"] }
crc = "3.4.0"
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
toml = "1.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[workspace]
members = ["gui"]
