format = 2
device = "binepad.bnk8"

[timing]
double_tap_ms = 260
hold_ms = 350

[[layers]]
keys = [
    "keyboard.arrow_up",           # K1: up arrow
    "keyboard.arrow_down",         # K2: down arrow
    "macro.3",                     # K3: new omp chat in a tmux window, current folder (prefix C-s, a)
    "keyboard.f6",                 # K4: omp copy last reply as Markdown (F6, ~/.omp/agent/extensions/bnk8-macropad.ts)
    "keyboard.f10",                # K5: omp /branch picker (F10 = app.session.fork, see ~/.omp/agent/keybindings.yml)
    "macro.2",                     # K6: omp reject (Esc)
    { hold = "keyboard.f9" },      # K7: hold = omp push-to-talk (F9, see ~/.omp/agent/keybindings.yml)
    "macro.1",                     # K8: omp accept (Ctrl+Q)
]

[layers.knob]                       # press: next layer; turn: omp effort (F7/F8, ~/.omp/agent/extensions/bnk8-macropad.ts)
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = "solid"
brightness = 80
speed = 120
color = "#730000"

[[layers]]
keys = [
    "claude.code.session.previous",
    "claude.code.session.next",
    "claude.chat.new",
    "claude.fast.toggle",
    "claude.code.session.fork",
    "claude.reject",
    { tap = "claude.voice", hold = "claude.voice" },
    "claude.accept",
]

[layers.knob]
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = "solid"
brightness = 80
speed = 120
color = "#A374F0"

[[layers]]
keys = [
    "media.previous",
    "media.next",
    "system.media.rewind",
    "media.play_pause",
    "system.media.fast-forward",
    "media.mute",
    "media.volume_down",
    "media.volume_up",
]

[layers.knob]
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = "solid"
brightness = 80
speed = 120
color = "#FF2300"

[[layers]]
keys = [
    "none",
    "none",
    "none",
    "none",
    "none",
    "none",
    "none",
    "none",
]

[layers.knob]
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = "solid"
brightness = 80
speed = 120
color = "#A4FF27"

# omp CLI shortcuts (see omp keybindings: app.approval.approve, Esc, app.stt.pushToTalk).
[macros]
1 = ["press modifier.left_control", "delay 10", "tap keyboard.q", "delay 10", "release modifier.left_control"]
2 = ["tap keyboard.escape"]
# tmux prefix (C-s) then `a`: see `bind a new-window ...` in ~/.tmux.conf.
3 = ["press modifier.left_control", "delay 10", "tap keyboard.s", "delay 10", "release modifier.left_control", "delay 20", "tap keyboard.a"]
