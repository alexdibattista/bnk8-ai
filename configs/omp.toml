device = "binepad.bnk8"

[timing]
double_tap_ms = 260
hold_ms = 350

[[layers]]
keys = [
    "keyboard.up",                 # K1: up arrow
    "keyboard.down",               # K2: down arrow
    "macro.2",                     # K3: new omp chat in a tmux window, current folder (prefix C-s, a)
    "keyboard.f6",                 # K4: omp copy last reply as Markdown (F6, ~/.omp/agent/extensions/bnk8-macropad.ts)
    "keyboard.f10",                # K5: omp /branch picker (F10 = app.session.fork, see ~/.omp/agent/keybindings.yml)
    "macro.1",                     # K6: omp reject (Esc)
    { hold = "keyboard.f9" },      # K7: hold = omp push-to-talk (F9, see ~/.omp/agent/keybindings.yml)
    "macro.0",                     # K8: omp accept (Ctrl+Q)
]

[layers.knob]                       # press: next layer; turn: omp effort (F7/F8, ~/.omp/agent/extensions/bnk8-macropad.ts)
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = 1
brightness = 80
speed = 120
color = "#730000"
flags = 1

[[layers]]
keys = [
    "raw.3f4d5904000002",
    "raw.67c88f2d000002",
    "raw.bd7302e6000002",
    "raw.f1db1315000002",
    "raw.165687f0000002",
    "raw.403d6e25000002",
    { tap = "raw.0f6407ea000002", hold = "raw.0f6407ea000002" },
    "raw.dfddf9e8000002",
]

[layers.knob]
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = 1
brightness = 80
speed = 120
color = "#A374F0"
flags = 1

[[layers]]
keys = [
    "media.previous",
    "media.next",
    "raw.6bbc48b6000001",
    "media.play_pause",
    "raw.bec97270000001",
    "media.mute",
    "media.volume_down",
    "media.volume_up",
]

[layers.knob]
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = 1
brightness = 80
speed = 120
color = "#FF2300"
flags = 1

[[layers]]
keys = [
    "none",
    "none",
    "none",
    "none",
    "none",
    "none",
    "none",
    "none",
]

[layers.knob]
tap = "layer.next"
ccw = "keyboard.f7"
cw = "keyboard.f8"

[layers.lighting]
effect = 1
brightness = 80
speed = 120
color = "#A4FF27"
flags = 1

# omp CLI shortcuts (see omp keybindings: app.approval.approve, Esc, app.stt.pushToTalk).
[macros]
0 = ["press keyboard.left_ctrl", "delay 10", "tap keyboard.q", "delay 10", "release keyboard.left_ctrl"]
1 = ["tap keyboard.escape"]
# tmux prefix (C-s) then `a`: see `bind a new-window ...` in ~/.tmux.conf.
2 = ["press keyboard.left_ctrl", "delay 10", "tap keyboard.s", "delay 10", "release keyboard.left_ctrl", "delay 20", "tap keyboard.a"]
